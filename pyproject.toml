[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jyas-ephemeris"
version = "0.0.1"
description = "Independent Apache-2.0 ephemeris computation core for the JYAS stack"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Avikalpa Kundu", email = "avi@gour.top" }]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/jyashq/jyas-ephemeris"
Issues = "https://github.com/jyashq/jyas-ephemeris/issues"

[tool.setuptools.packages.find]
where = ["src"]
