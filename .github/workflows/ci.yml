name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  privacy-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Privacy gate
        run: |
          chmod +x tools/check-privacy.sh
          tools/check-privacy.sh

      - name: Install package
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e . pytest

      - name: Smoke tests
        run: python3 -m pytest tests/ -q
